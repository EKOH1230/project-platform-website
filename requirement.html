<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="整理商业自动化设备采购需求草稿。V0 测试版不会提交或保存信息。"><title>发布需求｜Project Platform</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js?v=assistant1" defer></script></head><body data-page="requirement"><a class="skip-link" href="#main">跳到正文</a><div id="site-header"></div><main id="main"><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="index.html">首页</a> / 发布需求</div><span class="eyebrow light">POST A REQUIREMENT · V0</span><h1>描述你想解决的运营问题</h1><p class="lead">此页面是需求填写流程的测试版。填写内容只在当前页面生成可复制草稿，不会发送、上传或保存。</p></div></section><section class="section"><div class="container form-shell"><div class="form-card"><h2 style="font-size:1.7rem">采购需求草稿</h2><p>带 * 的项目必填。请勿在测试版填写个人敏感信息。</p><form id="requirement-form"><div class="form-grid"><div class="field"><label for="company">公司/组织 *</label><input id="company" name="company" autocomplete="organization" required maxlength="100"></div><div class="field"><label for="country">所在国家 *</label><input id="country" name="country" autocomplete="country-name" required maxlength="60"></div><div class="field"><label for="industry">行业 *</label><select id="industry" name="industry" required><option value="">请选择</option><option>餐饮</option><option>酒店与商业物业</option><option>零售</option><option>分销/进口</option><option>其他</option></select></div><div class="field"><label for="interest">关注的设备类型</label><select id="interest" name="interest"><option value="">尚未确定</option><option value="coffee">咖啡与饮品设备</option><option value="cooking">烹饪与备餐设备</option><option value="vending">智能售卖设备</option><option value="robot">服务机器人</option><option value="hotel">酒店与商业自动化</option><option value="other">其他</option></select></div><div class="field full"><label for="problem">希望解决的问题 *</label><textarea id="problem" name="problem" required maxlength="1200" placeholder="例如：希望在多家酒店提供全天候的自助咖啡服务"></textarea></div><div class="field"><label for="quantity">预计数量</label><input id="quantity" name="quantity" maxlength="60" placeholder="例如：5–10 台"></div><div class="field"><label for="budget">预算范围</label><input id="budget" name="budget" maxlength="80" placeholder="可留空，稍后讨论"></div><div class="field"><label for="timeline">采购时间</label><input id="timeline" name="timeline" maxlength="80" placeholder="例如：未来 6 个月"></div><div class="field"><label for="location">安装地点</label><input id="location" name="location" maxlength="100" placeholder="城市 / 场所类型"></div><div class="field full"><label for="details">其他要求</label><textarea id="details" name="details" maxlength="1200" placeholder="例如：支付方式、容量、定制、维护或售后条件"></textarea></div></div><div class="form-actions"><button class="button ink" type="submit">生成草稿 ↗</button><button class="button outline" type="reset">清空</button></div></form><div class="result" id="draft-result" aria-live="polite"><h3>已生成需求草稿</h3><pre id="draft-text"></pre><button class="button ink" type="button" id="copy-draft">复制草稿</button><p class="status" id="copy-status" role="status"></p></div></div><aside class="side-card"><span class="eyebrow">HOW TO PREPARE</span><h3 style="margin-top:12px">好需求通常包含</h3><ul class="item-list"><li>真实的商业应用场景</li><li>国家与安装地点</li><li>预计数量和时间</li><li>容量、支付或维护条件</li><li>预算范围（如已确定）</li></ul><p class="note">V0 测试版没有后台，也没有企业邮箱。生成草稿后，请自行保存。后续正式上线的联系方式和隐私说明仍待确定。</p></aside></div></section></main><div id="site-footer"></div></body></html>
